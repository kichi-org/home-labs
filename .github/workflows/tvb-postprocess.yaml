name: TVB Downloads Post-Processing
on:
  # schedule:
  #   - cron: '0 2 * * *' 
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no actual file moves)'
        required: true
        type: boolean
        default: false

jobs:
  Organize:
    runs-on: home-labs-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
      
      - name: Execute script
        run: uv run scripts/tvb_postprocess.py
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
