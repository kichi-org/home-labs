name: TVB Downloads Post-Processing
on:
  # schedule:
  #   - cron: '0 2 * * *' 
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no actual file moves)'
        required: true
        type: boolean
        default: false

jobs:
  Organize:
    runs-on: home-labs-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      
      - name: Execute script
        run: uv run scripts/tvb_postprocess.py
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
