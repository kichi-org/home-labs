name: Modify and Rebuild WhatsApp APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'WhatsApp version tag (used in output filename)'
        required: false
        default: 'latest'
        type: string

jobs:
  rebuild:
    runs-on: home-labs-runner

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install apktool
        run: |
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.12.1.jar -O apktool.jar
          chmod +x apktool
          sudo mv apktool apktool.jar /usr/local/bin/

      - name: Install zipalign and apksigner
        run: |
          mkdir -p ~/android-sdk/cmdline-tools
          cd ~/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest
          yes | ./latest/bin/sdkmanager --licenses >/dev/null 2>&1
          ./latest/bin/sdkmanager --update
          ./latest/bin/sdkmanager "build-tools;35.0.0" "platform-tools"

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Rebuild WhatsApp APK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          BUILD_TOOLS: 35.0.0
          VERSION: ${{ inputs.version || 'latest' }}
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/build-tools/$BUILD_TOOLS:$PATH"

          cd /data

          echo "Decompiling WhatsApp.apk ..."
          apktool d WhatsApp.apk -o whatsapp_new --res-resolve-mode dummy

          echo "Rebuilding ..."
          apktool b whatsapp_new -o whatsapp_fixed.apk --use-aapt1 --no-crunch

          echo "Signing with debug key ..."
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            whatsapp_fixed.apk androiddebugkey

          echo "Zipaligning to whatsapp_${VERSION}.apk ..."
          zipalign -v -p 4 whatsapp_fixed.apk whatsapp_${VERSION}.apk

          ls -lh whatsapp_${VERSION}.apk || echo "Final APK not found — check previous steps"